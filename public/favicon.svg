  <!-- Base -->
  <rect x="10" y="21" width="12" height="1.5" rx="0.75" fill="#c9a84c"/>
  <!-- Center beam -->
  <rect x="8" y="10.25" width="16" height="1.5" rx="0.75" fill="#c9a84c"/>
  <!-- Left pan string -->
  <line x1="9" y1="11.75" x2="7" y2="16" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="11.75" x2="13" y2="16" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M6.5 16 Q10 18.5 13.5 16" stroke="#c9a84c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Right pan string -->
  <line x1="21" y1="11.75" x2="19" y2="16" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="11.75" x2="25" y2="16" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right pan -->
